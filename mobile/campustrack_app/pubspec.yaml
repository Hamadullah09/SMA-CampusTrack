name: campustrack_app
description: CampusTrack — student and parent portals for the RFID-first school platform.
publish_to: "none"
version: 1.0.1+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management. Riverpod is chosen over provider/bloc here because the app is
  # read-heavy with many independent async slices (attendance, grades, timetable), and
  # its AsyncValue gives loading/error/data states without hand-rolled flags per screen.
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Secure token storage. Tokens must not sit in SharedPreferences: on a rooted or
  # jailbroken device that file is world-readable, and these tokens grant access to a
  # child's location history.
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Biometric unlock for returning users
  local_auth: ^2.3.0

  # Push notifications
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  intl: ^0.19.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
