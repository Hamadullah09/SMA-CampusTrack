allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Flutter's convention: build output goes to ../../build rather than each module's own
// build/ folder, so `flutter build` finds artefacts where it expects them.
rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
