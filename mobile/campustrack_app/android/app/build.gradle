plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

/**
 * Release signing.
 *
 * The keystore and its passwords never live in this repository. They are read from
 * key.properties (gitignored, see key.properties.template) for a local release build, or
 * from environment variables in CI, where they arrive as repository secrets.
 *
 * If neither is present the release build falls back to the debug key. That keeps
 * `flutter build apk --release` working for a quick test install, but such a build must
 * never reach families: Android identifies an app by its signature, so a debug-signed
 * install cannot be upgraded in place by a properly signed one later. Every device would
 * have to uninstall first, losing its login.
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader -> keystoreProperties.load(reader) }
}

def keystorePathFromEnv = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseKey = keystorePropertiesFile.exists() || (keystorePathFromEnv != null && !keystorePathFromEnv.isEmpty())

android {
    namespace = "net.smatechno.campustrack"

    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17

        // flutter_local_notifications uses java.time APIs that do not exist below API 26.
        // Desugaring back-fills them; without this the build fails outright.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        // Permanent. Android identifies the app by this string, and Play will never let it
        // change. Derived from sma-techno.net; the hyphen is dropped because a Java package
        // segment cannot contain one.
        applicationId = "net.smatechno.campustrack"

        // flutter_secure_storage requires 21+; local_auth's biometric prompt requires 23.
        minSdk = 23
        targetSdk = 35

        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            // PKCS12 is the default because that is what keytool has produced since JDK 9,
            // and what tools/generate-release-key.py writes. An older JKS keystore still
            // works by setting storeType=JKS in key.properties.
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties["storeFile"])
                storeType = keystoreProperties.getProperty("storeType", "PKCS12")
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            } else if (keystorePathFromEnv != null && !keystorePathFromEnv.isEmpty()) {
                storeFile = file(keystorePathFromEnv)
                storeType = System.getenv("ANDROID_KEYSTORE_TYPE") ?: "PKCS12"
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKey ? signingConfigs.release : signingConfigs.debug

            // Shrinking is off deliberately. The saving is modest for an app this size, and
            // an over-eager rule stripping a Firebase or Riverpod class produces a crash that
            // only shows up on a real device after release. Turn it on with a proguard file
            // once there is a device farm to catch that.
            minifyEnabled = false
            shrinkResources = false
        }
    }

    // Reports which key a build was signed with, so a debug-signed release cannot be
    // handed out by accident without it having been said out loud in the log.
    applicationVariants.configureEach { variant ->
        if (variant.buildType.name == "release" && !hasReleaseKey) {
            println("WARNING: no release keystore found; this APK is signed with the DEBUG key and must not be distributed.")
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

/**
 * Firebase is optional. Applying the google-services plugin without google-services.json
 * fails the build, so push notifications light up when the file is added rather than
 * blocking every build until then.
 */
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    println("google-services.json not found; building without Firebase push notifications.")
}
