name: Build Android APK

# Run on demand, or whenever a version tag is pushed. Kept out of CI because a release
# build takes several minutes and nobody needs it on every pull request.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Android versionCode (must exceed the last published build)'
        required: true
        default: '1'
  push:
    tags: ['v*']

jobs:
  android:
    name: Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/campustrack_app

    # The `secrets` context cannot be read from a step-level `if`; doing so is a workflow
    # parse error, not a runtime one, so the whole file is rejected. Surfacing the secret
    # as an environment variable at job level is the supported way to branch on whether
    # one is configured.
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # Job level, not step level. A step's own `env:` is not in scope for that step's
      # `if:` -- the condition is evaluated before the step environment is built, so the
      # flag reads as empty and the step silently never runs.
      HAS_PORTAL_CREDENTIALS: ${{ secrets.PORTAL_ADMIN_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v4

      # The Gradle toolchain Flutter drives needs a JDK; the Flutter action does not bring
      # one. 17 matches the sourceCompatibility in app/build.gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Always runs, and reports only whether each secret is present, never its value.
      # Without this a missing secret is invisible: the step that needs it is skipped, the
      # job still reports success, and nothing anywhere says why.
      - name: Report which secrets are configured
        if: always()
        run: |
          {
            echo "### Secrets"
            echo ""
            echo "| Secret | Set |"
            echo "|---|---|"
            echo "| ANDROID_KEYSTORE_BASE64 | ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'yes' || 'NO' }} |"
            echo "| ANDROID_KEYSTORE_PASSWORD | ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' && 'yes' || 'NO' }} |"
            echo "| ANDROID_KEY_ALIAS | ${{ secrets.ANDROID_KEY_ALIAS != '' && 'yes' || 'NO' }} |"
            echo "| ANDROID_KEY_PASSWORD | ${{ secrets.ANDROID_KEY_PASSWORD != '' && 'yes' || 'NO' }} |"
            echo "| PORTAL_ADMIN_PASSWORD | ${{ secrets.PORTAL_ADMIN_PASSWORD != '' && 'yes' || 'NO' }} |"
            echo ""
            echo "Publishing to the live portal requires PORTAL_ADMIN_PASSWORD. When it is"
            echo "not set the build still succeeds and produces an artefact, but nothing is"
            echo "published."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "PORTAL_ADMIN_PASSWORD set: ${{ secrets.PORTAL_ADMIN_PASSWORD != '' }}"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Test
        # A project with no test/ directory should not fail the release build.
        run: flutter test || [ ! -d test ]

      # The keystore arrives base64 encoded because a GitHub secret holds text, not a
      # binary. It is written outside the workspace so it cannot be picked up by a later
      # step that archives the build directory.
      - name: Restore the signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The app's API address is compiled in. Its default is the Android emulator's alias
      # for the developer's own machine, so a release built without this points at nothing
      # and fails to connect on every device. Set the API_BASE_URL repository variable
      # (Settings > Secrets and variables > Actions > Variables) to override the default
      # below without editing this file.
      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUMBER="${{ github.event.inputs.build_number || github.run_number }}"
          API_BASE_URL="${{ vars.API_BASE_URL || 'https://campus.sma-techno.net' }}"
          echo "Building against $API_BASE_URL"

          # A host not covered by network_security_config.xml is blocked by Android as
          # cleartext, so a mismatch here fails on device rather than in this job.
          case "$API_BASE_URL" in
            http://*)
              echo "::warning::Building against plain HTTP. Login tokens grant access to a child's location history and are readable by anyone on the same network. Move the site to HTTPS."
              ;;
          esac

          flutter build apk --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      # An APK signed with the debug key installs fine and looks correct, then can never be
      # upgraded in place by a properly signed build. That is expensive to discover after
      # handing it to families, so the build fails here instead.
      - name: Verify it is not debug signed
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "Certificate:"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt

          if grep -qi "CN=Android Debug" /tmp/certs.txt; then
            echo "::error::This APK is signed with the Android debug key. Set the ANDROID_KEYSTORE_* secrets before distributing a build."
            exit 1
          fi
          echo "Signed with a release key."

      - name: Report what was built
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "### Android build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Application id | \`net.smatechno.campustrack\` |"
            echo "| Version | $(grep '^version:' pubspec.yaml | cut -d' ' -f2) |"
            echo "| versionCode | ${{ github.event.inputs.build_number || github.run_number }} |"
            echo "| Size | $(du -h "$APK" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo ""
            echo "Download the artefact below, then publish it from **Mobile app → Publish a build** in the admin portal."
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional: hand the build straight to the live portal so nobody has to download an
      # artefact and re-upload it by hand. Skipped unless PORTAL_ADMIN_PASSWORD is set,
      # because it needs an account allowed to publish and that is a decision worth making
      # deliberately rather than inheriting.
      - name: Publish to the live portal
        if: env.HAS_PORTAL_CREDENTIALS == 'true'
        env:
          PORTAL_URL: ${{ vars.PORTAL_URL || 'https://campus.sma-techno.net' }}
          PORTAL_ADMIN_USER: ${{ vars.PORTAL_ADMIN_USER || 'admin' }}
          PORTAL_ADMIN_PASSWORD: ${{ secrets.PORTAL_ADMIN_PASSWORD }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number || github.run_number }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, subprocess, sys, urllib.request, urllib.error

          portal = os.environ["PORTAL_URL"].rstrip("/")
          apk = "build/app/outputs/flutter-apk/app-release.apk"
          version = re.search(r"^version:\s*([^\s+]+)", open("pubspec.yaml").read(), re.M).group(1)
          build_number = os.environ["BUILD_NUMBER"]

          def die(message):
              print(f"::error::{message}")
              sys.exit(1)

          # curl handles the multipart upload; doing it by hand in urllib buys nothing and
          # is easy to get subtly wrong for a 30 MB binary.
          login = subprocess.run(
              ["curl", "-sS", "-X", "POST", f"{portal}/api/v1/auth/login",
               "-H", "Content-Type: application/json",
               "-d", json.dumps({
                   "userNameOrEmail": os.environ["PORTAL_ADMIN_USER"],
                   "password": os.environ["PORTAL_ADMIN_PASSWORD"],
               })],
              capture_output=True, text=True)

          try:
              token = json.loads(login.stdout).get("accessToken")
          except json.JSONDecodeError:
              die(f"Sign-in to {portal} did not return JSON: {login.stdout[:200]}")

          if not token:
              die(f"Could not sign in to {portal}. Check PORTAL_ADMIN_PASSWORD.")

          print(f"Publishing {version} build {build_number} to {portal}")

          upload = subprocess.run(
              ["curl", "-sS", "-w", "\n%{http_code}", "-X", "POST",
               f"{portal}/api/v1/app/releases",
               "-H", f"Authorization: Bearer {token}",
               "-F", f"file=@{apk};type=application/vnd.android.package-archive",
               "-F", f"version={version}",
               "-F", f"buildNumber={build_number}",
               "-F", f"releaseNotes=Built from {os.environ['COMMIT_SHA'][:7]}"],
              capture_output=True, text=True)

          *body, status = upload.stdout.strip().split("\n")
          if status != "201":
              die(f"Publishing failed with HTTP {status}: {' '.join(body)[:300]}")

          print(f"Published. Families can download it from {portal}/mobile-app")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"\nPublished to <{portal}/mobile-app>.\n")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: sma-campus-track-android
          path: mobile/campustrack_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
