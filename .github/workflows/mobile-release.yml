name: Build Android APK

# Run on demand, or whenever a version tag is pushed. Kept separate from CI because a
# release build takes several minutes and nobody needs it on every pull request.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Android build number (must exceed the last published build)'
        required: true
        default: '1'
  push:
    tags: ['v*']

jobs:
  android:
    name: Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/campustrack_app

    steps:
      - uses: actions/checkout@v4

      # The Gradle toolchain Flutter drives needs a JDK; the Flutter action does not bring one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The Android platform folder is generated rather than committed. `flutter create`
      # on an existing project adds only what is missing and leaves lib/ and pubspec
      # untouched, so this is safe to run every time.
      #
      # NOTE: a generated project carries the default application id
      # (com.example.campustrack_app) and is signed with Flutter's debug key. That is fine
      # for sideloading to test devices. Before handing the app to real families, commit a
      # proper android/ folder with the school's application id and a release keystore --
      # a debug-signed build cannot be upgraded in place by a later, properly signed one.
      - name: Ensure Android platform files exist
        run: |
          if [ ! -d android ]; then
            echo "No android/ folder; generating platform scaffolding."
            flutter create --platforms=android --project-name campustrack_app .
          fi

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
        # A project with no test/ directory should not fail the build.
        continue-on-error: true

      - name: Build release APK
        run: |
          BUILD_NUMBER="${{ github.event.inputs.build_number || github.run_number }}"
          flutter build apk --release --build-number="$BUILD_NUMBER"

      - name: Report what was built
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "### Android build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Size | $(du -h "$APK" | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the artefact below, then publish it from **Mobile app → Publish a build** in the admin portal." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sma-campus-track-android
          path: mobile/campustrack_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
