name: Deploy to campus.sma-techno.net

# Deliberately manual by default. An FTP upload is not atomic -- the site is briefly serving
# a half-replaced set of files -- so it should happen when someone is watching, not on every
# merge. Flip `push:` on below once you are happy with the cadence.
on:
  workflow_dispatch:
  # Pushing a deploy-* tag starts a release. Still deliberate -- someone has to create the
  # tag -- but it does not require the Actions UI.
  push:
    tags: ['deploy-*']

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Checked before anything is built or uploaded. A site published without a connection
      # string starts, answers every request with a 500 and replaces a working placeholder
      # page with a broken one; failing here costs nothing by comparison.
      - name: Check the deployment is configured
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          PROD_JWT_KEY: ${{ secrets.PROD_JWT_KEY }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
        run: |
          missing=""
          for name in FTP_HOST FTP_USER FTP_PASSWORD PROD_CONNECTION_STRING PROD_JWT_KEY PROD_ADMIN_PASSWORD; do
            [ -z "${!name}" ] && missing="$missing $name"
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions." >> "$GITHUB_STEP_SUMMARY"
            echo "See docs/deployment/myasp-net.md for what each one holds." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # A short signing key is as good as none: it is what authenticates every request.
          if [ "${#PROD_JWT_KEY}" -lt 32 ]; then
            echo "::error::PROD_JWT_KEY is ${#PROD_JWT_KEY} characters. Use at least 32; generate one with: openssl rand -base64 64"
            exit 1
          fi

          echo "Configuration present."

      # Proves the credentials work and finds where the site actually lives, before a build
      # is spent on it. SmarterASP/site4now accounts are usually rooted at the site folder
      # with the web root in wwwroot/, but an account scoped to a subfolder lands directly in
      # it -- guessing wrong uploads a whole site into a directory nothing serves.
      - name: Locate the web root over FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        run: |
          if [ -n "$FTP_REMOTE_DIR" ]; then
            echo "Using the configured FTP_REMOTE_DIR: $FTP_REMOTE_DIR"
            echo "FTP_TARGET=$FTP_REMOTE_DIR" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Listing the FTP root..."
          if ! listing=$(curl -sS --list-only --connect-timeout 30 \
                --user "$FTP_USER:$FTP_PASSWORD" "ftp://$FTP_HOST/" 2>&1); then
            echo "::error::Could not connect to $FTP_HOST as $FTP_USER. Check the FTP secrets."
            echo "$listing"
            exit 1
          fi

          echo "$listing"

          # Prefer a wwwroot if the account root has one; otherwise the account is already
          # scoped to the site and files belong at its root.
          if echo "$listing" | grep -qx "wwwroot"; then
            target="/wwwroot/"
          else
            target="/"
          fi

          echo "Deploying to: $target"
          {
            echo "### FTP target"
            echo ""
            echo "Account root contains:"
            echo '```'
            echo "$listing"
            echo '```'
            echo ""
            echo "Uploading to \`$target\`. Set the **FTP_REMOTE_DIR** repository variable to override."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "FTP_TARGET=$target" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ---------------------------------------------------------------- web ----
      # No VITE_API_BASE is set on purpose. The client falls back to the relative path
      # /api/v1, so the same build works on any domain and reaches whichever API is
      # serving it. Baking an absolute URL in here is how a build ends up pinned to the
      # wrong environment.
      - name: Build the web portal
        working-directory: web
        run: |
          npm ci
          npm run build

      # ---------------------------------------------------------------- api ----
      - name: Publish the API
        run: |
          dotnet publish backend/src/CampusTrack.Api/CampusTrack.Api.csproj \
            -c Release \
            -r win-x64 --self-contained false \
            -p:PublishSingleFile=false \
            -o publish

      - name: Assemble the site
        run: |
          # The API serves the SPA from wwwroot and falls back to index.html, so the two
          # builds combine into one deployable tree rather than two sites.
          mkdir -p publish/wwwroot
          cp -r web/dist/* publish/wwwroot/

          # dotnet publish writes its own web.config; ours carries the MIME types, upload
          # limit and headers the product needs, so it wins.
          cp deploy/iis/web.config publish/web.config

          # Never ship developer settings to production: they carry a local connection
          # string, a known admin password and a signing key that is public in this repo.
          rm -f publish/appsettings.Development.json

          echo "Deploying $(du -sh publish | cut -f1):"
          ls publish | head -20

      # Written here rather than uploaded by hand once and forgotten. GitHub secrets stay the
      # single source of truth, and a rotated key takes effect on the next deploy instead of
      # requiring someone to remember which file on the server holds it.
      - name: Write production settings
        env:
          PROD_CONNECTION_STRING: ${{ secrets.PROD_CONNECTION_STRING }}
          PROD_JWT_KEY: ${{ secrets.PROD_JWT_KEY }}
          PROD_ADMIN_PASSWORD: ${{ secrets.PROD_ADMIN_PASSWORD }}
          PROD_SCHOOL_NAME: ${{ vars.SCHOOL_NAME || 'SMA Demonstration School' }}
          PROD_TIMEZONE: ${{ vars.SCHOOL_TIMEZONE || 'Pakistan Standard Time' }}
          PROD_RFID_BOOTSTRAP_KEY: ${{ secrets.PROD_RFID_BOOTSTRAP_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json, os, secrets, string

          # Still used for the RFID bootstrap key, which is exchanged by readers for their
          # own key on enrolment and never needs to be typed by a person.
          def rand(n=48):
              alphabet = string.ascii_letters + string.digits
              return ''.join(secrets.choice(alphabet) for _ in range(n))

          settings = {
              "ConnectionStrings": {"Default": os.environ["PROD_CONNECTION_STRING"]},
              "Database": {
                  # Creates the schema on first start. Safe to leave on: migrations are
                  # idempotent and a deploy that cannot migrate should fail loudly.
                  "AutoMigrate": True,
                  "AutoSeed": True,
              },
              "Jwt": {
                  "Key": os.environ["PROD_JWT_KEY"],
                  "Issuer": "SMACampusTrack",
                  "Audience": "SMACampusTrackClients",
                  "AccessTokenMinutes": 60,
                  "RefreshTokenDays": 30,
              },
              "Seed": {
                  "AdminUserName": "admin",
                  "AdminEmail": "admin@sma-techno.net",
                  # Used only on the very first start, against an empty database. It is a
                  # required secret rather than a generated value: generating one produced a
                  # password nobody had seen, written into a file on the server, and every
                  # later deploy replaced it with a different one that the already-created
                  # administrator did not have. Requiring it means the person deploying
                  # always knows the credential they are creating.
                  "AdminPassword": os.environ["PROD_ADMIN_PASSWORD"],
              },
              "School": {"Name": os.environ["PROD_SCHOOL_NAME"], "Code": "SMA"},
              "SchoolTime": {"TimeZoneId": os.environ["PROD_TIMEZONE"]},
              "RfidDevices": {
                  "RequireDeviceAuthentication": True,
                  "BootstrapApiKey": os.environ.get("PROD_RFID_BOOTSTRAP_KEY") or rand(),
              },
              "FileStorage": {"RootPath": "storage"},
              "Cors": {"AllowedOrigins": ["https://campus.sma-techno.net"]},
              "Serilog": {
                  "MinimumLevel": {
                      "Default": "Warning",
                      "Override": {"Microsoft": "Error", "System": "Error"},
                  },
                  "WriteTo": [{
                      "Name": "File",
                      "Args": {
                          "path": "logs/campustrack-.log",
                          "rollingInterval": "Day",
                          "retainedFileCountLimit": 14,
                      },
                  }],
              },
              "AllowedHosts": "*",
          }

          with open("publish/appsettings.Production.json", "w", encoding="utf-8") as f:
              json.dump(settings, f, indent=2)
          print("Wrote appsettings.Production.json")
          PYEOF

      - name: Guard against shipping development settings
        run: |
          if [ -f publish/appsettings.Development.json ]; then
            echo "::error::Development settings are present in the publish output."
            exit 1
          fi
          if grep -rl "development-only-signing-key" publish 2>/dev/null | grep -q .; then
            echo "::error::The development JWT signing key is present in the publish output."
            exit 1
          fi
          echo "Clean."
      # ------------------------------------------------------- restart the app ----
      # The ASP.NET Core Module restarts the application when web.config changes, and only
      # then. A deploy that changes nothing but assemblies therefore leaves the previous
      # code running: the new DLLs sit on disk, the worker keeps serving what it already
      # loaded, and the deploy reports success. That is how a fix to the upload size limit
      # shipped, passed every check, and still answered from the old code.
      #
      # app_offline.htm is the supported way to say otherwise. The module stops the app and
      # serves that file instead; removing it starts the app again, which loads whatever is
      # now on disk. Taking it down before the upload also means no assembly is locked while
      # it is being replaced.
      #
      # The site is down for the length of the upload. That is a few seconds for the usual
      # delta, and it is honest: an FTP upload is not atomic, so mid-upload the site was
      # already serving a half-replaced set of files rather than a clear maintenance page.
      - name: Take the app offline
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          target="${FTP_TARGET:-/}"
          printf '%s' '<html><head><title>Updating</title></head><body><h1>SMA Campus Track is updating</h1><p>This takes about a minute. Please try again shortly.</p></body></html>' > offline.htm

          curl -sS --fail --connect-timeout 30 --user "$FTP_USER:$FTP_PASSWORD" \
            -T offline.htm "ftp://$FTP_HOST${target}app_offline.htm"

          echo "App is offline; waiting for the worker to drain."
          sleep 8


      # ---------------------------------------------------------------- ftp ----
      # Credentials come from repository secrets and never touch a developer machine.
      # Settings > Secrets and variables > Actions:
      #   FTP_HOST, FTP_USER, FTP_PASSWORD
      - name: Upload over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ env.FTP_TARGET }}
          # The action keeps a manifest on the server and uploads only what changed, which
          # turns a ~40 MB first deploy into seconds on subsequent runs.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/logs/**
            **/storage/**

      # storage/ holds published APKs and assignment attachments, and logs/ is written by
      # the running site. Both are excluded above so a deploy never deletes uploaded files.

      # This step decides whether the deploy is reported as a success, so it fails rather
      # than warns. An earlier version ended on `::warning::`, which exits zero: the site
      # was answering 500.34 on every route and the run still came up green. A deploy that
      # leaves the site broken and says otherwise is worse than one that simply fails.
      # wwwroot is the application's own static-files folder. A web.config there registers
      # the ASP.NET Core handler a second time and IIS refuses to run either app with
      # HTTP 500.34. An early deploy created exactly that by uploading the publish output
      # into wwwroot; this makes sure a deploy can never leave one behind again.
      - name: Remove any nested web.config
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          creds="$FTP_USER:$FTP_PASSWORD"
          target="${FTP_TARGET:-/}"

          nested=$(curl -sS --max-time 25 --user "$creds" "ftp://$FTP_HOST${target}wwwroot/web.config" 2>/dev/null || echo "")
          if [ -n "$nested" ]; then
            echo "Removing stale ${target}wwwroot/web.config"
            curl -sS --user "$creds" "ftp://$FTP_HOST${target}" -Q "DELE ${target}wwwroot/web.config" || true
          else
            echo "No nested web.config present."
          fi

      # Removing app_offline.htm starts the application again, and it loads the assemblies
      # that were just uploaded. `if: always()` matters: if an earlier step fails the site
      # must still come back, rather than being left showing the maintenance page.
      - name: Bring the app back online
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          creds="$FTP_USER:$FTP_PASSWORD"
          target="${FTP_TARGET:-/}"

          curl -sS --user "$creds" "ftp://$FTP_HOST${target}" -Q "DELE ${target}app_offline.htm" \
            || curl -sS --user "$creds" "ftp://$FTP_HOST${target}" -Q "DELE app_offline.htm" \
            || true

          still=$(curl -sS --max-time 25 --user "$creds" "ftp://$FTP_HOST${target}app_offline.htm" 2>/dev/null || echo "")
          if [ -n "$still" ]; then
            echo "::error::app_offline.htm is still present -- the site is showing the maintenance page. Delete ${target}app_offline.htm over FTP."
            exit 1
          fi

          echo "App is back online; it will load the newly uploaded assemblies on the next request."

      - name: Verify the site responds
        run: |
          SITE=https://campus.sma-techno.net

          for i in $(seq 1 12); do
            code=$(curl -s -o /tmp/probe.html -w '%{http_code}' --max-time 30 "$SITE/health/live" || echo 000)
            echo "attempt $i: $code"

            if [ "$code" = "200" ]; then
              # Healthy is necessary but not sufficient: confirm the SPA is really being
              # served rather than an IIS error page that happens to return 200.
              root=$(curl -s --max-time 30 "$SITE/" || true)
              if echo "$root" | grep -q "SMA Campus Track"; then
                echo "Site is up and serving the portal."
                echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "<$SITE> is live and healthy." >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "Healthy, but the root did not serve the portal. Retrying."
            fi

            sleep 15
          done

          echo "::error::The site did not come up within three minutes."
          {
            echo "### Deploy failed verification"
            echo ""
            echo "Last status: \`$code\`. First 40 lines of the response:"
            echo '```'
            head -40 /tmp/probe.html 2>/dev/null || echo "(no body)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
